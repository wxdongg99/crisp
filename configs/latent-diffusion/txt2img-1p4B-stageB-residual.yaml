# Stage-B residual training config (CRISP BPRC stage 2, LFP mask loss).
#
# Frozen Stage-A principal + trainable Stage-B residual condition path.
# Stage-B fits noise - stop_gradient(eps_A) inside the LFP support.
#
# Example:
#   python main.py \
#     --base configs/latent-diffusion/txt2img-1p4B-stageB-residual.yaml \
#     -t --actual_resume models/ldm/text2img-large/model.ckpt \
#     --spatial_encoder_embedding --data_enhance \
#     --mvtec_path /path/to/mvtec --init_word anomaly \
#     --stage B --stage_a_ckpt_root logs/.../stageA_run \
#     --stage_b_init_from random --cfg_b 1.0 \
#     --override_max_steps 50000

model:
  base_learning_rate: 5.0e-3
  target: ldm.models.diffusion.ddpm.LatentDiffusion
  params:
    linear_start: 0.00085
    linear_end: 0.012
    num_timesteps_cond: 1
    log_every_t: 200
    timesteps: 1000
    first_stage_key: image
    cond_stage_key: caption
    image_size: 32
    channels: 4
    cond_stage_trainable: true
    conditioning_key: crossattn
    monitor: val/loss_simple_ema
    scale_factor: 0.18215
    use_ema: False
    embedding_reg_weight: 0.0
    personalization_config:
      target: ldm.modules.embedding_manager2.EmbeddingManager
      params:
        placeholder_strings: ["*"]
        initializer_words: ["sculpture"]
        per_image_tokens: false
        num_vectors_per_token: 4
        progressive_words: False

    unet_config:
      target: ldm.modules.diffusionmodules.openaimodel.UNetModel
      params:
        image_size: 32
        in_channels: 4
        out_channels: 4
        model_channels: 320
        attention_resolutions:
        - 4
        - 2
        - 1
        num_res_blocks: 2
        channel_mult:
        - 1
        - 2
        - 4
        - 4
        num_heads: 8
        use_spatial_transformer: true
        transformer_depth: 1
        context_dim: 1280
        use_checkpoint: true
        legacy: False

    first_stage_config:
      target: ldm.models.autoencoder.AutoencoderKL
      params:
        embed_dim: 4
        monitor: val/rec_loss
        ddconfig:
          double_z: true
          z_channels: 4
          resolution: 256
          in_channels: 3
          out_ch: 3
          ch: 128
          ch_mult:
          - 1
          - 2
          - 4
          - 4
          num_res_blocks: 2
          attn_resolutions: []
          dropout: 0.0
        lossconfig:
          target: torch.nn.Identity

    cond_stage_config:
      target: ldm.modules.encoders.modules.BERTEmbedder
      params:
        n_embed: 1280
        n_layer: 32

data:
  target: main.DataModuleFromConfig
  params:
    batch_size: 4
    num_workers: 2
    wrap: false
    shuffle_val_dataloader: True
    train:
      target: ldm.data.personalized.Personalized_mvtec_encoder
      params:
        size: 256
        set: train
        per_image_tokens: false
        repeats: 200
    validation:
      target: ldm.data.personalized.Personalized_mvtec_encoder
      params:
        size: 256
        set: validate
        per_image_tokens: false
        repeats: 1

lightning:
  modelcheckpoint:
    params:
      every_n_train_steps: 6250
  callbacks:
    image_logger:
      target: main.ImageLogger
      params:
        batch_frequency: 500
        max_images: 8
        increase_log_steps: False

  trainer:
    benchmark: True
    # ZJU Stage-A: 4 defect classes x 12,500 steps = 50,000.
    # Checkpoint interval = max_steps / 8 = 6,250.
    max_steps: 50000
